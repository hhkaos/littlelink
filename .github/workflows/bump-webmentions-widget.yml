name: Bump webmentions widget

# The widget is vendored (assets/js/webmentions/) rather than loaded from a CDN,
# so the page has no third-party runtime dependency. That also means Dependabot
# cannot see it: this checks the registry and opens a PR with the new files.
#
# Source of the widget: https://github.com/hhkaos/webmentions-widget
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PACKAGE: '@hhkaos/webmentions-widget'
  TARGET_FILE: index.html
  VENDOR_DIR: assets/js/webmentions

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve current and latest version
        id: versions
        run: |
          current="$(grep -oE '@hhkaos/webmentions-widget@[0-9]+\.[0-9]+\.[0-9]+' "$TARGET_FILE" \
            | head -1 | sed 's/.*@//')"

          if [ -z "$current" ]; then
            echo "No vendored $PACKAGE version found in $TARGET_FILE — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(npm view "$PACKAGE" version)"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "skip=$([ "$current" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Vendored $current, latest $latest"

      - name: Re-vendor and rewrite the version marker
        if: steps.versions.outputs.skip == 'false'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          tarball="$(npm pack "$PACKAGE@$LATEST" --silent)"
          tar -xzf "$tarball"
          cp package/src/core.js package/src/render.js "$VENDOR_DIR/"
          rm -rf package "$tarball"

          sed -i "s|$PACKAGE@$CURRENT|$PACKAGE@$LATEST|g" "$TARGET_FILE"
          git diff --stat

      - name: Open pull request
        if: steps.versions.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          branch="bump/webmentions-widget-$LATEST"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists — a PR is presumably open."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: bump webmentions widget to $LATEST"
          git push origin "$branch"

          # Built with printf rather than inline: a multi-line string here would
          # break out of this block scalar.
          body="$(printf '%s\n\n%s\n' \
            "Vendored \`$PACKAGE\` bumped from \`$CURRENT\` to \`$LATEST\`." \
            "Changelog: https://github.com/hhkaos/webmentions-widget/blob/main/CHANGELOG.md")"

          # This repo is a fork, so --repo and --base must be explicit or the PR
          # would be opened against sethcottle/littlelink.
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: bump webmentions widget to $LATEST" \
            --body "$body"
